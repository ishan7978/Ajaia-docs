{% extends "docs/base.html" %}
{% block title %}Log in · Ajaia Docs{% endblock %}
{% block body %}
<div class="container login-box">
  <div class="card">
    <h2 class="section">Log in</h2>
    {% if form.errors %}<div class="inline-error">Wrong username or password.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus required>
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <p><button class="btn-primary" type="submit">Log in</button></p>
    </form>
    <p class="hint">
      Demo accounts: <code>alice</code>, <code>bob</code>, <code>carol</code>
      &mdash; password for all: <code>demo1234</code>
    </p>
  </div>
</div>
{% endblock %}
